# infra/docker-compose.production.yml
services:
  frontend:
    container_name: foodgram-front
    image: ffreemann/foodgram-frontend:latest
    volumes:
      - frontend_build:/app/result_build

  db:
    container_name: foodgram-db
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodgram_user -d foodgram"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: foodgram-backend
    image: ffreemann/foodgram-backend:latest
    env_file: .env
    volumes:
      - static_value:/app/backend_static/
      - media_value:/app/media/
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    container_name: foodgram-proxy
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
      - ../docs/:/usr/share/nginx/redoc/:ro
      - static_value:/var/html/backend_static/:ro
      - media_value:/var/html/media/:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_value:
  media_value:
  frontend_build: